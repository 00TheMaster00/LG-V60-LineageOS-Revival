name: Validate public release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install camera patch dependency
        run: python -m pip install --no-binary=bsdiff4 --require-hashes -r DIY/06-LG-Camera/requirements-camera-hashed.txt
      - name: Camera builder unit tests
        run: python -m unittest discover -s DIY/06-LG-Camera/tests -v
      - name: Native camera recipe syntax
        run: bash -n DIY/06-LG-Camera/source/native/build_surface_usage_shim.sh
      - name: Performance workflow tests
        run: bash DIY/05-Performance-Kernel/workflow/tests/syntax-check.sh
      - name: PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'DIY/05-Performance-Kernel/workflow/Install-V60Profiles.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Recovery tool tests
        run: python -m unittest discover -s DIY/01-Recovery-Backup/tests -v
      - name: Public-release tool tests
        run: python -m unittest discover -s tools/tests -v
      - name: Public-data audit
        run: python tools/audit_public_release.py
      - name: Markdown links
        run: python tools/check_markdown_links.py
      - name: Release manifest
        run: python tools/generate_release_manifest.py --check
